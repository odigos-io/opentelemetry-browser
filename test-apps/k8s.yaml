---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browser-test
  namespace: test-apps
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol-version: HTTP1
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /react
            pathType: Prefix
            backend:
              service:
                name: react-app
                port:
                  number: 80
          - path: /vue
            pathType: Prefix
            backend:
              service:
                name: vue-app
                port:
                  number: 80
          - path: /angular
            pathType: Prefix
            backend:
              service:
                name: angular-app
                port:
                  number: 80
          - path: /next
            pathType: Prefix
            backend:
              service:
                name: next-app
                port:
                  number: 3000
          - path: /nuxt
            pathType: Prefix
            backend:
              service:
                name: nuxt-app
                port:
                  number: 3000
          - path: /sveltekit
            pathType: Prefix
            backend:
              service:
                name: sveltekit-app
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-1
                port:
                  number: 3001
