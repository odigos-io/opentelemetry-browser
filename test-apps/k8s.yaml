        containerName: next-app
        language: browser
  workload:
    kind: Deployment
    name: next-app
    namespace: test-apps
---
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: nuxt-app
  namespace: test-apps
spec:
  containerOverrides:
    - containerName: nuxt-app
