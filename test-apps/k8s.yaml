---
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: test-apps
  namespace: test-apps
spec:
  workload:
    kind: Namespace
    name: test-apps
    namespace: test-apps
---
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: angular-app
  namespace: test-apps
spec:
  containerOverrides:
    - containerName: angular-app
      runtimeInfo:
        containerName: angular-app
        language: browser
  workload:
    kind: Deployment
    name: angular-app
    namespace: test-apps
---
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: next-app
  namespace: test-apps
spec:
  containerOverrides:
    - containerName: next-app
