# All browser-instrumentation test apps and backends for the test-apps namespace.
#
# Distributed trace chain:
#   browser app  --(same-origin /api/chain)-->  backend-1  --(/work)-->  backend-2
#
# SSR apps (next/nuxt/sveltekit) use a Source with language: browser so Odigos injects the
# odigos-browser-proxy sidecar instead of in-process Node instrumentation.
# Backend Sources opt them into server-side Node auto-instrumentation.
---
apiVersion: v1
kind: Namespace
metadata:
  name: test-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-1
  namespace: test-apps
  labels:
    app: backend-1
    browser-otel-test: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-1
  template:
    metadata:
      labels:
        app: backend-1
        browser-otel-test: "true"
    spec:
      containers:
        - name: backend-1
          image: staging-registry.odigos.io/browser-otel-backend-1:dev
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "3001"
            - name: BACKEND2_URL
              value: "http://backend-2.test-apps.svc.cluster.local:3002/work"
          ports:
            - containerPort: 3001
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-1
  namespace: test-apps
  labels:
    app: backend-1
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  selector:
    app: backend-1
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
