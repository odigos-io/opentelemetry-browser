server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy to backend-1 (ALB also routes /api for path-prefixed access).
    location /api/ {
        proxy_pass http://backend-1.test-apps.svc.cluster.local:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Shared-ALB path prefix (matches vite/angular base).
    location /react/ {
        rewrite ^/react/?(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
