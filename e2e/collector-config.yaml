# Minimal OpenTelemetry Collector config for e2e tests: accept OTLP over gRPC/HTTP and log every
# span with full detail so the workflow can assert traces arrived (grep for service.name).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
